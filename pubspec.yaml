name: kreyno
description: A new Flutter project.
publish_to: "none"
version: 0.1.0

environment:
  sdk: "^3.8.0"

dependencies:
  animations: ^2.0.11
  pretty_dio_logger: ^1.4.0
  string_validator: ^1.2.0
  dio: ^5.9.0
  dotted_border: ^3.1.0
  easy_localization: ^3.0.8
  flag: ^7.0.0
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.0
  flutter_svg: ^2.0.17
  fpdart: ^1.1.1
  freezed_annotation: ^3.1.0

  google_maps_flutter: ^2.12.3
  image_picker: ^1.2.0
  json_annotation: ^4.9.0
  pinput: ^5.0.1
  retrofit: ^4.6.0
  stacked: ^3.4.0
  stacked_services: ^1.1.0
  syncfusion_flutter_datepicker: ^31.1.21

dev_dependencies:
  build_runner: ^2.4.5
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  golden_toolkit: ^0.15.0
  json_serializable: ^6.9.0
  mockito: ^5.4.1
  retrofit_generator: ^10.0.5
  freezed: ^3.2.3
  stacked_generator: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/translations/
    - .env

  fonts:
    - family: Satoshi
      fonts:
        - asset: assets/font/Satoshi-Regular.otf
        - asset: assets/font/Satoshi-Medium.otf
        - asset: assets/font/Satoshi-Bold.otf
