name: kreyno
description: A new Flutter project.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.0.3 <4.0.0"

dependencies:
  animations: ^2.0.11
  dio: ^5.9.0
  dotted_border: ^2.1.0
  easy_localization: ^3.0.8
  flag: ^7.0.0
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.0
  flutter_svg: ^2.0.17
  freezed: ^2.5.7
  google_maps_flutter: ^2.12.3
  pinput: ^5.0.1
  retrofit: ^4.6.0
  stacked: ^3.4.0
  stacked_services: ^1.1.0
  string_validator: ^1.2.0
  syncfusion_flutter_datepicker: ^29.1.38
  json_annotation: ^4.9.0   # ⬅️ this one is required in dependencies

dev_dependencies:
  build_runner: ^2.4.5
  flutter_lints: ^2.0.0
  flutter_test:
    sdk: flutter
  golden_toolkit: ^0.15.0
  mockito: ^5.4.1
  stacked_generator: ^1.3.3
  retrofit_generator: ^9.3.0
  json_serializable: ^6.9.0


flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/translations/
    - .env

  fonts:
    - family: Satoshi
      fonts:
        - asset: assets/font/Satoshi-Regular.otf
        - asset: assets/font/Satoshi-Medium.otf
        - asset: assets/font/Satoshi-Bold.otf
