name: kreyno
description: A new Flutter project.
publish_to: "none"
version: 2.0.0+1

environment:
  sdk: "^3.8.0"

dependencies:
  animations: ^2.0.11
  app_settings: ^6.1.1
  app_tracking_transparency: ^2.0.6+1
  cached_network_image: ^3.4.1
  change_app_package_name: ^1.5.0
  dart_geohash: ^2.1.0
  dio: ^5.9.0
  dotted_border: ^2.1.0
  easy_localization: ^3.0.8
  firebase_analytics: ^12.6.0
  firebase_core: ^4.11.0
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.2.1
  flutter_stripe: ^12.0.2
  flutter_svg: ^2.0.17
  flutter_timezone: ^5.0.1
  fpdart: ^1.1.1
  freezed_annotation: ^3.1.0
  geocoding: ^4.0.0
  geolocator: ^14.0.2
  google_maps_flutter: ^2.12.3
  google_places_flutter: ^2.1.1
  image_picker: ^1.2.0
  internet_connection_checker: ^3.0.1
  json_annotation: ^4.9.0
  laravel_echo_null: ^0.2.0
  logger: ^2.6.1
  map_launcher: ^4.4.2
  permission_handler: ^12.0.1
  phonecodes: ^0.0.4
  pinput: ^5.0.1
  pretty_dio_logger: ^1.4.0
  pusher_client_socket: ^0.0.7
  retrofit: ^4.7.1
  shared_preferences: ^2.5.3
  sliver_tools: ^0.2.12
  socket_io_client: ^3.1.0+2
  stacked: ^3.4.0
  stacked_services: ^1.1.0
  string_validator: ^1.2.0
  syncfusion_flutter_datepicker: ^29.1.38
  toastification: ^3.0.3
  url_launcher: ^6.3.2
  uuid: ^4.5.1

dev_dependencies:
  build_runner: ^2.4.5
  flutter_lints: ^2.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.0
  golden_toolkit: ^0.15.0
  json_serializable: ^6.10.0
  mockito: ^5.4.1
  retrofit_generator: ^10.0.2
  stacked_generator: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/translations/
    - .env

  fonts:
    - family: Satoshi
      fonts:
        - asset: assets/font/Satoshi-Regular.otf
        - asset: assets/font/Satoshi-Medium.otf
        - asset: assets/font/Satoshi-Bold.otf
