name: kreyno
description: A new Flutter project.
publish_to: "none"
version: 0.1.0

environment:
  sdk: "^3.8.0"

dependencies:
  flutter:
    sdk: flutter
  google_maps_flutter: ^2.12.3
  stacked: ^3.4.0
  stacked_services: ^1.1.0
  # animations
  animations: ^2.0.11
  # UI
  flutter_svg: ^2.0.17
  pinput: ^5.0.1
  dotted_border: ^2.1.0
  syncfusion_flutter_datepicker: ^29.1.38
  # localization
  easy_localization: ^3.0.8
  # logger
  logger: ^2.6.1
  # Networking
  retrofit: ^4.7.1
  dio: ^5.9.0
  pretty_dio_logger: ^1.4.0
  # data modeling
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  # Utils
  image_picker: ^1.1.2
  shared_preferences: ^2.5.3
  permission_handler: ^12.0.1
  string_validator: ^1.2.0
  phonecodes: ^0.0.4
  # ENV
  flutter_dotenv: ^5.2.1

dev_dependencies:
  build_runner: ^2.4.5
  flutter_lints: ^2.0.0
  flutter_test:
    sdk: flutter
  golden_toolkit: ^0.15.0
  mockito: ^5.4.1
  stacked_generator: ^2.0.0
  retrofit_generator: ^10.0.2
  freezed: ^3.2.0
  json_serializable: ^6.10.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/translations/
    - .env

  fonts:
    - family: Satoshi
      fonts:
        - asset: assets/font/Satoshi-Regular.otf
        - asset: assets/font/Satoshi-Medium.otf
        - asset: assets/font/Satoshi-Bold.otf
